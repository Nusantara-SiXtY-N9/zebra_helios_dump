[BATTERY_CHARGING_CTL]
disable 1

[LCD_management]
disable 1

[SS-QUIET-THERM-GPU]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device gpu
set_point 47000
set_point_clr 40000
time_constant 0
device_max_limit 266000000

[SS-QUIET-THERM-GOLD]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu4
set_point 45000
set_point_clr 40000
time_constant 0
device_max_limit 1747200

[SS-QUIET-THERM-SILVER]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu0
set_point 47000
set_point_clr 40000
time_constant 0
device_max_limit 1536000

[CAMERA_SKIN_EXIT_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 63000
thresholds_clr 58000
actions camera+camcorder
action_info 10+10

[MODEM_PROC_TEMP_MITIGATION]
disable 1

[MODEM_PA_MITIGATION]
disable 1

