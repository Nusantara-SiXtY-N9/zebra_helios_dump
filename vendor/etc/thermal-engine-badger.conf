sampling 2000
sensor quiet-therm-adc
device cpu4
set_point -11000
set_point_clr -13000
time_constant 0
device_max_limit 1113600

[SS-QUIET-THERM-SILVER]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu0
set_point 47000
