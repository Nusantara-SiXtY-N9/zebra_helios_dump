[BATTERY_CHARGING_CTL]
disable 1

[SS-QUIET-THERM-GOLD]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu4
set_point 45000
set_point_clr 40000
time_constant 0
device_max_limit 1747200

[SS-QUIET-THERM-SILVER]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device cpu0
set_point 47000
set_point_clr 40000
time_constant 0
device_max_limit 1536000

[SS-QUIET-THERM-GPU]
algo_type ss
sampling 2000
sensor quiet-therm-adc
device gpu
set_point 47000
set_point_clr 40000
time_constant 0
device_max_limit 266000000

[MODEM_PROC_TEMP_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 53000 60000
thresholds_clr 50000 57000
actions modem_proc+report modem_proc+report
action_info 1+0 3+0

[MODEM_PA_MITIGATION]
disable 1

[MODEM_PA_THERM0_MITIGATION]
algo_type monitor
sensor pa-therm-0-adc
sampling 5000
thresholds 70000 80000 85000
thresholds_clr 65000 75000 83000
actions modem+report modem+report modem+report
action_info 1+0 2+0 3+0

[MODEM_PA_THERM1_MITIGATION]
algo_type monitor
sensor pa-therm-1-adc
sampling 5000
thresholds 70000 80000 85000
thresholds_clr 65000 75000 83000
actions modem+report modem+report modem+report
action_info 1+0 2+0 3+0

[LCD_management]
disable 1

[CAMERA_SKIN_EXIT_MITIGATION]
algo_type monitor
sampling 10000
sensor quiet-therm-adc
thresholds 65000
thresholds_clr 60000
actions camera+camcorder
action_info 10+10
