#bcn_timeout=6
## beacon monitor
#bcn_li_dtim=0
#bcn_li_bcn=1

##roam trigger by LOW RSSI factor
#roam_delta=25
#roam_trigger_2g=-70
#roam_trigger_5g=-75
##change the roam trigger for all band
#roam_trigger=-75
##roam trigger by signal drop step factor
#roam_signal_drop_step=0
#roam_signal_drop_block_time=5
##roam trigger by QBSS load(CU) factor
#roam_qbss_load_threshold=179
#roam_qbss_load_duration=10
##roam score compute algorithm
#roam_score_rssi_bounder_a=-65
#roam_score_rssi_bounder_b=-80
#roam_score_coeff_a=0xB4010A01
#roam_score_coeff_b=0xB4020A01
#roam_score_coeff_c=0xB4030A01
##roam_score_coeffs <index> <param_1> <param_2> <param_3> <param_4>
#roam_score_coeffs=0 180 1 10 1
#roam_score_coeff=0xB4010A01

##candidate score = 65535 + rssi*c1 + (band == pref_band)*c2 + cipher_quantity*c3 + qbss_load*c4
##c2=(25*10)10db delta for rssi>roam_score_rssi_bounder_a(-65) on preferend band
##c2=(25*7)7db delta for roam_score_rssi_bounder_a(-65)>rssi>roam_score_rssi_bounder_b(-80)
##c2=(25*0)0db delta for rssi<roam_score_rssi_bounder_b(-80)
##coeff_a=0x2AFF0001(c1=42,c2=255(C1 * 6db bonus),c3=0,c4=1)
#roam_score_coeff_a=0x2AFF0001 # no more supported
##coeff_b=0x2AFF0001(c1=42,c2=255(C1 * 6db bonus),c3=0,c4=1)
#roam_score_coeff_b=0x2AFF0001 # no more supported
##coeff_c=0x2A000000(c1=42,c2=0,c3=0,c4=0)
#roam_score_coeff_c=0x2A000000 # no more supported
#ZEBRA-519 maps roam_score_coeffs=0/1/2 to older roam_score_coeff_a/b/c and
#allows 32 bit config, (but to be restricted to 16 bit for each co-efficients)
#i.e(0~32768) to avoid 32 bit computing overflow.
#roam_score_coeffs=0  42 420 0 1 (c1=42,c2=420,c3=0,c4=1)
roam_score_coeffs=0  42 420 0 1
#roam_score_coeffs=0  42 420 0 1 (c1=42,c2=420,c3=0,c4=1)
roam_score_coeffs=1  42 420 0 1
#roam_score_coeffs=0  42 420 0 1 (c1=42,c2=0,c3=0,c4=0)
roam_score_coeffs=2  42 0 0 0

##Zebra-308
##initiate full roam scan if RSSI of candidates from parial roam scan are lower than this value
##roam_partial_result_rssi_filter_bound=0 (disabled)
roam_partial_result_rssi_filter_bound=-80

##Zebra-508
#Abort ongoing Escan when a new roam scan starts
roam_can_abort_escan=1

##ZEBRA-617
##Skip few firmware CCX-IAPP features like roam threshold on device
##CCX_IAPP_TYPE_ROAM + CCX_IAPP_SUBTYPE_ROAM_REP2 CCX_IAPP_TYPE_ROAM + CCX_IAPP_SUBTYPE_ROAM_REQ3 CCXv2_IAPP_TYPE_ROAM + CCXv2_IAPP_SUBTYPE_ROAM_REQ
ccx_droam=0

### powersaving related
##power management 0,1,2
#PM=2


###11k bitmask.
#0x0001 Link_Measurement
#0x0002 Neighbor_Report
#0x0004 Parallel_Measurement
#0x0008 Repeated_Measurement
#0x0010 Beacon_Passive - mandatory
#0x0020 Beacon_Active - mandatory
#0x0040 Beacon_Table - mandatory
#0x0080 Beacon_measurement_Reporting_Condition
#0x0100 Frame_Measurement
#0x0200 Channel_load_Measurement
#0x0400 Noise_Histogram_measurement
#0x0800 Statistics_Measurement
#0x1000 LCI_Measurement
#0x2000 LCI_Azimuth
#0x4000 Tx_Stream_Category_Measurement
#0x8000 Triggered_Tx_stream_Category_Measurement
#0x10000 AP_Channel_Report
#0x20000 RM_MIB
#0x8000000 Measurement_Pilot_Transmission_Information
#0x10000000 Neighbor_Report_TSF_Offset
#0x20000000 RCPI_Measurement
#0x40000000 RSNI_Measurement
#0x80000000 BSS_Average_Access_Delay
#0x100000000 BSS_Available_Admission_Capacity
#0x200000000 Antenna_Information
#0x400000000 FTM_Range_Reporting
#0x800000000 Civic_Location_Measurement
#rrm=0x00010871

###BW CAP. BW20:bit 0. BW40:bit 1. BW80:bit 2.
