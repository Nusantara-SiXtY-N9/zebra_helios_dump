### Fusion Roaming Configuration : Start
roam_off=0
roam_time_thresh=2000
scan_assoc_time=40
scan_unassoc_time=40
scan_passive_time=110
scan_home_time=120
scan_home_away_time=40
scan_nprobes=2
roam_period=10
full_roam_period=0x7FFFFFFF
bcn_timeout=6
bcn_li_dtim=0
bcn_li_bcn=1
roam_delta=5
roam_trigger=-65
roam_signal_drop_step=5
roam_signal_drop_block_time=3
### Fusion Roaming Configuration : End

### Fusion Traffic monitor configuration: start
enable_traffic_monitor=1
###Fusion Traffic monitor configuration: end

### Fusion Timer Configuration : Start
#Enable(1)/Disable(0) per packet retry
pfrt_en=1
#Auth retry limit
pfrt_auth=10
#Assoc retry limit
pfrt_asrq=10
#Reassoc retry limit
pfrt_rasrq=10
##default:300. unit: ms
#Timeout for assoc request which didn't get a response
pfrt_assoc_timeout=200
##default:300. unit: ms
#Timeout for auth request which didn't get a response
pfrt_auth_timeout=200
#ZEBRA-559:Timeout for SAE-auth request which didn't get a response
##default:600. unit: ms
pfrt_sae_auth_timeout=500
#ZEBRA-363:assoc_retry_max is used to configure the max number retry connecting with AP if no auth or assoc response
assoc_retry_max=3
### Fusion Timer Configuration : End

