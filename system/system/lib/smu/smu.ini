# All Path Configuration
[boot]
CONTROL_SOCKET_PATH=/data/tmp/smu_control.sock
DATA_SOCKET_PATH=/data/tmp/smu_data.sock
SIMULATION_PATH=/data/tmp/smu_sim.sock
STORAGE_PATH=/storage/sdcard0/
SMU_DB_PATH=/data/tmp/smu.db
PLUGINS_PATH=/enterprise/device/settings/ptt/
MIN_SCAN_INTERVAL_MS=5000
MIN_SCAN_AGING_INTERVAL_SEC=12
DEFAULT_WLAN_INTERFACE=wlan0
HANDLE_SIGNAL_FLAG=0
smu_analysis_status=0
logcat_verbosity=3
# All Configurations related packet capture.
[packet_capture]
; Max Memory Size is stored in MB. Maximum of 85% of the SDCards total Size is allowed.
MAX_MEMORY_SIZE=40
; File size is always stored in mb.
FILE_SIZE=5
FILE_NAME=wa
CAPTURE_TYPE=0
CAPTURE_DURATION=08:00:00
CAPTURE_START_TIME=0
EXPIRY_DURATION=3
is_running_first_time=1
is_running=0
is_capture_saving_from_logging_running=0
started_by=NONE

[scan]
use_packets=1

[roam_analysis]
report_log_level=0
ping_traffic_type=2
packet_viewer_level=2
packet_capture_type=0
initial_connection_fail=0
disconnect_steady_connection=0
roam_performance_issue=0
network_reachability_issue=0
traffic_performance_issue=0
upload_enable=0
host_sftp_address=empty
user_name=empty
password=empty
update_interval=0
runtime_failure_report_enable=0
disconnect_related_handoff=0
use_default_gateway=1
ip_address=1.1.1.1
generic_reports_enable=0
url=0
ssid=empty
low_storage_space_setting=1
packet_capture_enable=0
enable_application_scan=0
device_model=empty
connected_bssid=empty
started_by=NONE

[roam_analysis_algorithm]
roam_retry_threshold_ms=3000

[licensing_stack_supported_features_mpa3]
SMU_Basic=1
SMU_Roam=1
SMU_Voice = 0
SMU_Security = 0

[licensing_stack_supported_features_qcom]
SMU_Basic=1
SMU_Roam=0
SMU_Voice = 0
SMU_Security = 0

[licensing_stack_supported_features_brcm]
SMU_Basic=1
SMU_Roam=1
SMU_Voice = 0
SMU_Security = 0

[licensing]
license_file_path              = /enterprise/smu/served.bin
url                            =

[voice_analysis_algorithm_threshold]
latency_threshold=200
jitter_threshold=100
packet_loss_threshold=20
channel_load_threshold=50
retry_threshold=20
snr_threshold=25
link_quality_threshold=3.5

[voice_analysis_rtp_traffic_threshold]
started_by=NONE
latency_threshold=150
jitter_threshold=50
packet_loss_threshold=20
channel_load_threshold=50
retry_threshold=20
snr_threshold=25
link_quality_threshold=3.0
rtp_timeout=60

# 8956 platform
[msm8952]
feature=SMU_Voice

# sdm660 platform
[sdm660]
feature=SMU_Basic

# sdm660 with Monitor mode
[sdm660mon]
feature=SMU_Voice

# bolton without Monitor mode
[bolton]
feature=SMU_Voice

# athena platform
[lahaina]
feature=SMU_Voice

[smu_version]
Atlas_SmartMU_VERSION=3.2.14
SDM_SmartMU_VERSION=3.1.14
Smu_Middleware_VERSION=3.2.11

# coverageview
[coverageview]
session_name=wa
ssid=101
scan_interval_ms=6000
low_storage_space_setting=0
reachability=0
is_running=0
started_by=NONE

#scanlist
[scanlist]
scan_interval_ms=6000

# Temporary Password
[temporary_password]
start_date=""
start_time=""
prev_date=""
prev_time=""
duration=0
is_temp_password=0

# connection_analysis
[connection_analysis]
master_retry=3
eap_request_timeout=70000
eap_timeout=70000
started_by=NONE

[current_analysis_mode]
voice_analysis_mode=0
roam_analysis_mode=0
current_feature=2

[voice_active_analysis]
